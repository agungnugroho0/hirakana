<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hirakata</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-black to-gray-950">

    <!-- Container utama -->
    <div class="min-h-screen flex flex-col justify-center items-center px-6">

        <!-- Judul -->
        <h1 class="text-3xl font-bold text-white mb-10 text-center font-mono">
            FLASH CARD GAMES JAPANESE
        </h1>


        <!-- Container kartu -->
        <div class="flex flex-wrap justify-center items-center gap-6 max-w-6xl">


            <!-- HIRAGANA -->
            <button id="btn-hiragana"
                class="group w-48 h-72 bg-white rounded-2xl
                       shadow-2xl p-5
                       flex flex-col justify-between
                       transition-all duration-200
                       hover:-translate-y-3 hover:shadow-white/20
                       active:scale-95">

                <!-- Contoh huruf -->
                <div class="flex-1 flex items-center justify-center">

                    <span class="text-8xl font-bold text-gray-900">
                        あ
                    </span>

                </div>

                <!-- Nama kartu -->
                <div class="text-xl font-bold text-gray-900 text-center">
                    HIRAGANA
                </div>

            </button>


            <!-- KATAKANA -->
            <button id="btn-katakana"
                class="group w-48 h-72 bg-white rounded-2xl
                       shadow-2xl p-5
                       flex flex-col justify-between
                       transition-all duration-200
                       hover:-translate-y-3 hover:shadow-white/20
                       active:scale-95">

                <!-- Contoh huruf -->
                <div class="flex-1 flex items-center justify-center">

                    <span class="text-8xl font-bold text-gray-900">

                       flex flex-col justify-between
                       transition-all duration-200
                       hover:-translate-y-3 hover:shadow-white/20
                       active:scale-95">

                <!-- Contoh huruf -->
                <div class="flex-1 flex items-center justify-center">

                    <span class="text-8xl font-bold text-gray-900">
                        日
                    </span>

                </div>

                <!-- Nama kartu -->
                <div class="text-center">

                    <div class="text-xl font-bold text-gray-900">
                        KANJI DASAR
                    </div>

                    <span class="text-sm text-gray-500 italic font-light">
                        coming soon
                    </span>

                </div>

            </button>


            <!-- KANJI N5 -->
            <button id="btn-kANJI-N5"
                class="group w-48 h-72 bg-white rounded-2xl
                       shadow-2xl p-5
                       flex flex-col justify-between
                       transition-all duration-200

                       active:scale-95">

                <!-- Contoh huruf -->
                <div class="flex-1 flex items-center justify-center">

                    <span class="text-8xl font-bold text-gray-900">

                </div>

                <!-- Nama kartu -->

                    <div class="text-xl font-bold text-gray-900">
                        KANJI N5
                    </div>

                    <span class="text-sm text-gray-500 italic font-light">
                        coming soon
                    </span>

                </div>

            </button>


            <!-- KANJI N4 -->
            <button id="btn-kANJI-N4"
                class="group w-48 h-72 bg-white rounded-2xl
                       shadow-2xl p-5
                       flex flex-col justify-between
                       transition-all duration-200

                       active:scale-95">

                <div class="flex-1 flex items-center justify-center">

                    <span class="text-8xl font-bold text-gray-900">

                    </span>

                </div>

        <p class="text-gray-300 mt-8 text-center">
            Mari tingkatkan hafalanmu dengan lebih menyenangkan 😊
        </p>

    </div>


    <script src="utama.js"></script>

</html>
