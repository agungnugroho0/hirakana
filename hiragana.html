
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hirakata</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        .kelompok {
            aspect-ratio: 3 / 4;
            min-height: 125px;
            background: white;
            border-radius: 14px;
            padding: 10px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            color: #111827;
            font-weight: bold;
            font-size: 24px;

            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0,0,0,.2);

            transition: all .2s ease;
        }

        .kelompok::before {
            content: attr(data-preview);
            align-self: flex-start;
            font-size: 12px;
        }

        .kelompok:hover {
            transform: translateY(-7px);
            box-shadow: 0 12px 20px rgba(0,0,0,.3);
        }

        .kelompok:active {
            transform: scale(.95);
        }

        .kelompok .kana {
            font-size: clamp(30px, 4vw, 48px);
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kelompok .nama {
            font-size: 12px;
            text-align: center;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .kelompok {
                min-height: 105px;
                padding: 7px;
            }

            .kelompok .nama {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="hira" data-kana="hiragana"></div>
